name: Underwriting CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: underwriting
          POSTGRES_PASSWORD: underwriting
          POSTGRES_DB: underwriting
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U underwriting"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m mypy app --ignore-missing-imports
      - run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml:.runs/coverage.xml --junitxml=.runs/test-results.xml --cov-fail-under=95
        env:
          RUN_POSTGRES_TESTS: "1"
      - run: python -m app.cli evaluate --output .runs/ci-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: .runs/
